services:
  app:
    build: .
    container_name: bank-app
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/bank
      CORS_ORIGIN: http://localhost
    networks:
      - bank-net

  mongo:
    image: mongo:7
    container_name: bank-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - bank-net

  nginx:
    image: nginx:1.27-alpine
    container_name: bank-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bank-net

volumes:
  mongo_data:

networks:
  bank-net:
